name: Desktop (Windows e Linux)

# Testa e empacota o MOVA para computador:
#   Windows: instalador em português (Inno Setup; instala por cima) + versão portátil (ZIP)
#   Linux:   Flatpak (qualquer distribuição) + versão portátil (tar.gz)
# Também baixa os componentes reais do mecanismo (yt-dlp, FFmpeg, QuickJS) e
# executa cada um, nos dois sistemas.

on:
  push:
    branches: ["**"]
    tags: ["desktop-v*"]
    paths:
      - "desktop/**"
      - "core/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "tools/i18n/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "core/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # Número do build: terceiro campo da versão do instalador (sempre crescente).
  MOVA_BUILD_NUMBER: ${{ github.run_number }}
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Traduções conferem com o português
        run: python3 tools/i18n/gen.py desktop && git diff --exit-code desktop/src/main/composeResources
      - name: Testes (core + desktop)
        run: ./gradlew -Pmova.desktopOnly=true :core:test :desktop:test --stacktrace
      - name: Capturas das telas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-capturas-de-tela
          path: desktop/build/screenshots/*.png
          if-no-files-found: ignore

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Linux no 22.04: o app-image (e a versão portátil) funciona também em distros mais antigas.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      # JetBrains Runtime: é ele que vai dentro do app (barra de título integrada no Windows).
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Versão
        run: |
          VERSION=$(sed -n 's/^val movaDesktopVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LABEL=$VERSION-build$MOVA_BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Mecanismo real (yt-dlp, FFmpeg, QuickJS)
        env:
          MOVA_INTEGRATION: "1"
        run: ./gradlew -Pmova.desktopOnly=true :desktop:test --tests '*EngineIntegrationTest*'

      - name: Windows — app e versão portátil
        if: runner.os == 'Windows'
        run: |
          ./gradlew -Pmova.desktopOnly=true -Pmova.release=true :desktop:createReleaseDistributable
          mkdir -p dist
          (cd desktop/build/compose/binaries/main-release/app && 7z a -tzip "$GITHUB_WORKSPACE/dist/MOVA-Windows-$LABEL-portatil.zip" MOVA > /dev/null)

      - name: Windows — instalador (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $app = Join-Path $pwd "desktop\build\compose\binaries\main-release\app\MOVA"
          & $iscc "/DAppVersion=$env:VERSION" "/DAppImage=$app" "/O$pwd\dist" "/FMOVA-Windows-$env:LABEL-instalador" "desktop\packaging\windows\mova.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist

      - name: Linux — app e versão portátil
        if: runner.os == 'Linux'
        run: |
          ./gradlew -Pmova.desktopOnly=true -Pmova.release=true :desktop:createReleaseDistributable
          mkdir -p dist
          tar -czf "dist/MOVA-Linux-$LABEL-portatil.tar.gz" -C desktop/build/compose/binaries/main-release/app MOVA


      - uses: actions/upload-artifact@v6
        with:
          name: MOVA-${{ runner.os }}-${{ env.LABEL }}
          path: dist/*

  # Flatpak no contêiner oficial do Flathub (flatpak-builder e runtime 25.08 já instalados),
  # a partir da versão portátil gerada no job anterior.
  flatpak:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Versão
        run: |
          VERSION=$(sed -n 's/^val movaDesktopVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)
          echo "LABEL=$VERSION-build$MOVA_BUILD_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v5
        with:
          name: MOVA-Linux-${{ env.LABEL }}
          path: linux
      - name: Montar o Flatpak
        run: |
          F=desktop/packaging/flatpak
          mkdir -p "$F/mova-app" dist
          tar -xzf "linux/MOVA-Linux-$LABEL-portatil.tar.gz" -C "$F/mova-app" --strip-components=1
          cp desktop/packaging/mova.png "$F/mova.png"
          flatpak-builder --force-clean --disable-rofiles-fuse --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build "$F/io.github.valeriofra.Mova.yml"
          flatpak build-bundle flatpak-repo "dist/MOVA-Linux-$LABEL.flatpak" io.github.valeriofra.Mova \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -la dist
      - uses: actions/upload-artifact@v6
        with:
          name: MOVA-Linux-Flatpak-${{ env.LABEL }}
          path: dist/*.flatpak

  release:
    needs: [package, flatpak]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_name == github.event.repository.default_branch ||
       startsWith(github.ref, 'refs/tags/desktop-v') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          # Só os instaladores (as capturas de tela ficam apenas nos artefatos da execução).
          pattern: MOVA-*
          path: dist
          merge-multiple: true
      - name: Publicar versão para computador
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          TAG="desktop-build-$MOVA_BUILD_NUMBER"
          PRERELEASE=""
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ] && [[ "${{ github.ref }}" != refs/tags/desktop-v* ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "MOVA para computador (build $MOVA_BUILD_NUMBER)" \
            --notes "Windows: MOVA-Windows-*-instalador.exe (em português; instala por cima da versão anterior) ou o .zip portátil. Linux: MOVA-Linux-*.flatpak (flatpak install --user MOVA-Linux-*.flatpak) ou o .tar.gz portátil. Branch: ${{ github.ref_name }} · commit ${GITHUB_SHA::7}." \
            $PRERELEASE
